<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kinegami</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; flex-direction: column;
      width: 100vw; height: 100vh; overflow: hidden;
      background: #1a1a2e; color: #ccc;
      font-family: monospace; font-size: 12px;
    }
    /* ── Top hint bar ── */
    #topbar {
      flex: 0 0 26px; display: flex; align-items: center;
      background: #0f0f1e; border-bottom: 1px solid #333;
      padding: 0 10px; gap: 14px; color: #777;
    }
    .kbd {
      display: inline-block; padding: 0 4px; border-radius: 2px;
      background: #252540; color: #bbb; border: 1px solid #444; font-size: 11px;
    }
    /* ── Main row ── */
    #main { flex: 1; display: flex; overflow: hidden; min-height: 0; }
    /* ── Panels ── */
    .panel {
      flex: 0 0 200px; overflow-y: auto; overflow-x: hidden;
      background: #12122a; padding: 4px;
    }
    #left-panel  { border-right: 1px solid #2a2a4a; }
    #right-panel { border-left:  1px solid #2a2a4a; }
    .sec-title {
      font-size: 10px; color: #666; text-transform: uppercase;
      letter-spacing: .06em; padding: 6px 4px 3px;
      border-bottom: 1px solid #1e1e3a; margin-bottom: 4px;
    }
    .panel-sec { margin-bottom: 10px; }
    button {
      background: #252540; color: #ccc; border: 1px solid #3a3a5a;
      border-radius: 3px; padding: 3px 8px; cursor: pointer;
      font-family: monospace; font-size: 11px;
    }
    button:hover { background: #353560; }
    button.full  { width: 100%; margin: 2px 0; text-align: left; }
    button.danger { border-color: #6a2222; color: #e88; }
    button.danger:hover { background: #3a1a1a; }
    input[type=number], select {
      background: #1a1a2e; color: #ccc; border: 1px solid #3a3a5a;
      border-radius: 3px; padding: 2px 4px; font-family: monospace; font-size: 11px;
    }
    select { width: 100%; }
    .row { display: flex; gap: 4px; align-items: center; margin: 2px 0; }
    label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 11px; }
    /* ── Viewport ── */
    #viewport { flex: 1; position: relative; overflow: hidden; min-width: 0; }
    #viewport canvas { display: block; cursor: grab; }
    #viewport canvas:active { cursor: grabbing; }
    #status {
      position: absolute; bottom: 8px; left: 8px;
      color: #666; font-size: 11px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <span><span class="kbd">T</span> Translate</span>
    <span><span class="kbd">R</span> Rotate</span>
    <span><span class="kbd">Space</span> Local/World</span>
    <span><span class="kbd">Esc</span> Deselect</span>
    <span><span class="kbd">Del</span> Delete</span>
  </div>

  <div id="main">
    <!-- Left panel (future: file, options) -->
    <div id="left-panel" class="panel">
      <div class="sec-title">File</div>
      <button class="full" id="btn-undo">↩ Undo</button>
      <button class="full" id="btn-redo">↪ Redo</button>
      <button class="full" id="btn-save" style="margin-top:6px">Save Tree</button>
      <button class="full" id="btn-load">Load Tree…</button>
      <input type="file" id="load-file-input" accept=".pkl" style="display:none">
      <button class="full" id="btn-export">Export STL Modules</button>
    </div>

    <!-- 3D viewport -->
    <div id="viewport">
      <div id="status">Loading…</div>
    </div>

    <!-- Right panel -->
    <div id="right-panel" class="panel">
      <div class="panel-sec">
        <div class="sec-title">Add Joints</div>
        <button class="full" id="btn-add-transverse">+ Transverse Revolute</button>
        <button class="full" id="btn-add-coaxial">+ Coaxial Revolute</button>
        <button class="full" id="btn-add-tip">+ Tip (Hemisphere)</button>
        <button class="full danger" id="btn-clear-tree" style="margin-top:8px">Clear Tree</button>
      </div>

      <div class="panel-sec">
        <div class="sec-title">Edit Joints</div>
        <div class="row">
          <select id="joint-select" style="flex:1"></select>
          <button id="btn-delete" class="danger" title="Delete selected joint">✕</button>
        </div>
        <div class="row" style="margin-top:6px">
          <label><input type="radio" name="gmode" value="translate" checked> Translate</label>
          <label><input type="radio" name="gmode" value="rotate"> Rotate</label>
        </div>
        <label style="margin-top:4px">
          <input type="checkbox" id="gizmo-local"> Local frame
        </label>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }     from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { buildLinkGeometry } from './dubinsCSC.js';

    // ── Scene ─────────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(
      45, window.innerWidth / window.innerHeight, 0.1, 100000);
    camera.position.set(600, 400, 600);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    const viewportEl = document.getElementById('viewport');
    viewportEl.appendChild(renderer.domElement);
    const ro = new ResizeObserver(() => {
      const w = viewportEl.clientWidth, h = viewportEl.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
    ro.observe(viewportEl);

    // ── Lighting ──────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(600, 900, 600);
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x8888ff, 0.4);
    fill.position.set(-400, -200, -400);
    scene.add(fill);

    // ── Orbit controls ────────────────────────────────────────────────────────
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.08;

    // ── Transform gizmo ───────────────────────────────────────────────────────
    // gizmoPivot sits at the selected joint's center.
    // When a joint is selected, all its scene objects are reparented here via
    // attach(), so they move with the gizmo in real time.
    const gizmoPivot = new THREE.Object3D();
    scene.add(gizmoPivot);

    const gizmo = new TransformControls(camera, renderer.domElement);
    scene.add(gizmo);

    let gizmoMode  = 'translate';
    let gizmoSpace = 'world';
    gizmo.setMode(gizmoMode);
    gizmo.setSpace(gizmoSpace);

    gizmo.addEventListener('dragging-changed', e => {
      orbit.enabled = !e.value;
      if (e.value) {
        // Drag started — snapshot the gizmo's current transform so we can
        // revert if the user releases in an invalid configuration.
        if (selectedJointIndex >= 0) {
          _dragIsValid = true;
          _dragStartPos.copy(gizmoPivot.position);
          _dragStartQuat.copy(gizmoPivot.quaternion);
          _lastValidPos.copy(gizmoPivot.position);
          _lastValidQuat.copy(gizmoPivot.quaternion);
          _liveTubeMat.color.copy(LIVE_COLOR_OK);
          _setServerLinksVisible(selectedJointIndex, false);
          _updateLiveTubes(selectedJointIndex);
        }
      } else {
        // Drag ended
        if (selectedJointIndex >= 0) {
          if (_dragIsValid) {
            // Valid position — keep live tubes visible until server responds;
            // buildScene() (called inside sendMoveJoint) will tear them down.
            sendMoveJoint();
          } else {
            // Invalid position — revert gizmo pivot to last valid drag position,
            // then commit that position to the server (live tubes stay visible
            // until buildScene replaces them).
            gizmoPivot.position.copy(_lastValidPos);
            gizmoPivot.quaternion.copy(_lastValidQuat);
            gizmoPivot.updateMatrixWorld(true);
            _dragIsValid = true;
            _liveTubeMat.color.copy(LIVE_COLOR_OK);
            sendMoveJoint();
          }
        }
      }
    });

    gizmo.addEventListener('change', () => {
      if (selectedJointIndex >= 0 && gizmo.dragging)
        _updateLiveTubes(selectedJointIndex);
    });

    // ── Real-time Dubins CSC link preview (zero-latency during drag) ─────────
    // link_index → THREE.Mesh  (replaces server-computed links while dragging)
    const _liveTubes     = new Map();
    // link_index → { tUnit, tMag, c1s, c2s }  (warm-start for next frame)
    const _liveSolutions = new Map();
    // maxAnglePerElbow parsed from server geometry response
    let maxAnglePerElbow = Math.PI / 12;

    // Drag-validity state — used to prevent releasing in an invalid configuration
    let _dragIsValid   = true;
    const _dragStartPos  = new THREE.Vector3();   // gizmoPivot position at drag start
    const _dragStartQuat = new THREE.Quaternion(); // gizmoPivot quaternion at drag start
    const _lastValidPos  = new THREE.Vector3();   // gizmoPivot position at last valid frame
    const _lastValidQuat = new THREE.Quaternion(); // gizmoPivot quaternion at last valid frame

    const LIVE_COLOR_OK  = new THREE.Color(0.5,  0.5,  0.5);

    const _liveTubeMat = new THREE.MeshPhongMaterial({
      color: new THREE.Color(0.5, 0.5, 0.5), side: THREE.DoubleSide, shininess: 40,
    });

    // Apply the gizmo's current world transform to points/directions that were
    // in world space at the joint's original pose, returning full SE3 objects.
    function _transformByGizmo(idx) {
      const info       = jointInfo[idx];
      const oldPos     = new THREE.Vector3(...info.position);
      const oldQuatInv = new THREE.Quaternion(...info.quaternion).invert();
      gizmoPivot.updateMatrixWorld(true);
      const newPos  = new THREE.Vector3();
      const newQuat = new THREE.Quaternion();
      gizmoPivot.matrixWorld.decompose(newPos, newQuat, new THREE.Vector3());

      // Transform a world-space point
      const tp = p => {
        const v = new THREE.Vector3(...p).sub(oldPos)
                    .applyQuaternion(oldQuatInv).applyQuaternion(newQuat).add(newPos);
        return [v.x, v.y, v.z];
      };
      // Transform a world-space direction
      const td = d => {
        const v = new THREE.Vector3(...d).applyQuaternion(oldQuatInv).applyQuaternion(newQuat);
        return [v.x, v.y, v.z];
      };

      return {
        proxPose: {
          t: tp(info.proximal_dubins_pos),
          x: td(info.proximal_dubins_xhat),
          y: td(info.proximal_dubins_yhat),
          z: td(info.proximal_dubins_zhat),
        },
        distPose: {
          t: tp(info.distal_dubins_pos),
          x: td(info.distal_dubins_xhat),
          y: td(info.distal_dubins_yhat),
          z: td(info.distal_dubins_zhat),
        },
        r: info.r,
      };
    }

    function _setServerLinksVisible(idx, visible) {
      const p = parentsArray[idx];
      if (p >= 0)
        for (const obj of (linkObjectMap.get(idx) ?? [])) obj.visible = visible;
      for (let c = 0; c < parentsArray.length; c++)
        if (parentsArray[c] === idx)
          for (const obj of (linkObjectMap.get(c) ?? [])) obj.visible = visible;
    }

    function _updateOrCreateLiveMesh(li, result) {
      if (!result || result.vertices.length === 0) return;
      const positions = new Float32Array(result.vertices.flat());
      const indices   = new Uint32Array(result.faces.flat());
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geom.setIndex(new THREE.BufferAttribute(indices, 1));
      geom.computeVertexNormals();
      if (_liveTubes.has(li)) {
        const m = _liveTubes.get(li);
        m.geometry.dispose();
        m.geometry = geom;
      } else {
        const m = new THREE.Mesh(geom, _liveTubeMat);
        scene.add(m);
        _liveTubes.set(li, m);
      }
    }

    function _updateLiveTubes(idx) {
      const moved     = _transformByGizmo(idx);
      const parentIdx = parentsArray[idx];

      // ── First pass: try computing all affected links ───────────────────────
      const tryResults = new Map();
      let allValid = true;

      if (parentIdx !== undefined && parentIdx >= 0 && jointInfo[parentIdx]) {
        const pi = jointInfo[parentIdx];
        const startPose = {
          t: pi.distal_dubins_pos,  x: pi.distal_dubins_xhat,
          y: pi.distal_dubins_yhat, z: pi.distal_dubins_zhat,
        };
        const result = buildLinkGeometry(
          moved.r, startPose, moved.proxPose,
          maxAnglePerElbow, 8, _liveSolutions.get(idx) ?? null);
        if (result) tryResults.set(idx, result); else allValid = false;
      }

      for (let c = 0; c < parentsArray.length; c++) {
        if (parentsArray[c] !== idx || !jointInfo[c]) continue;
        const ci = jointInfo[c];
        const endPose = {
          t: ci.proximal_dubins_pos,  x: ci.proximal_dubins_xhat,
          y: ci.proximal_dubins_yhat, z: ci.proximal_dubins_zhat,
        };
        const result = buildLinkGeometry(
          moved.r, moved.distPose, endPose,
          maxAnglePerElbow, 8, _liveSolutions.get(c) ?? null);
        if (result) tryResults.set(c, result); else allValid = false;
      }

      // ── Second pass: commit or freeze ─────────────────────────────────────
      if (allValid) {
        // All links solved — update geometry and warm-start cache
        for (const [li, result] of tryResults) {
          _liveSolutions.set(li, result.solution);
          _updateOrCreateLiveMesh(li, result);
        }
        _dragIsValid = true;
        _liveTubeMat.color.copy(LIVE_COLOR_OK);
        _lastValidPos.copy(gizmoPivot.position);
        _lastValidQuat.copy(gizmoPivot.quaternion);
      } else {
        // At least one link failed — freeze tubes at last valid geometry, no visual change
        _dragIsValid = false;
        // _liveSolutions intentionally not updated (preserve last valid warm-start)
      }
    }

    function _removeLiveTubes() {
      for (const m of _liveTubes.values()) {
        scene.remove(m);
        m.geometry.dispose();
      }
      _liveTubes.clear();
      _liveSolutions.clear();
    }

    // ── Selection state ───────────────────────────────────────────────────────
    const HIGHLIGHT   = new THREE.Color(0xff4400);
    const NO_EMISSIVE = new THREE.Color(0x000000);

    // joint_index → [visible meshes]  (for emissive highlight)
    const jointMeshMap   = new Map();
    // joint_index → [all scene objects: meshes + lines]  (for reparenting)
    const jointObjectMap = new Map();
    // link_index → [all scene objects for that link]  (for live replacement)
    const linkObjectMap  = new Map();
    // flat list of all joint meshes including pick-only (for raycaster)
    const allJointMeshes = [];

    let jointInfo          = {};   // joint_index → {position, quaternion, type, r, dubins…}
    let parentsArray       = [];   // parentsArray[i] = parent joint index of joint i
    let selectedJointIndex = -1;

    // All objects added to the scene from tree geometry — cleared on rebuild
    const treeObjects = [];

    const status = document.getElementById('status');

    function updateStatus(note = '') {
      let s;
      if (selectedJointIndex >= 0) {
        const t = jointInfo[selectedJointIndex]?.type ?? '?';
        s = `Joint ${selectedJointIndex} (${t}) · ${gizmoMode} · ${gizmoSpace}`;
      } else {
        const n = treeObjects.filter(o => o.isMesh && !o.userData.pickOnly).length;
        s = `${n} meshes`;
      }
      status.textContent = note ? `${s} — ${note}` : s;
    }

    function positionGizmo(idx) {
      const info = jointInfo[idx];
      if (!info) return;
      const [x, y, z]          = info.position;
      const [qx, qy, qz, qw]   = info.quaternion;
      gizmoPivot.position.set(x, y, z);
      gizmoPivot.quaternion.set(qx, qy, qz, qw);
      gizmoPivot.updateMatrixWorld(true);
      gizmo.attach(gizmoPivot);
    }

    function selectJoint(idx) {
      // ── Deselect previous ──────────────────────────────────────────────────
      if (selectedJointIndex >= 0) {
        // Move objects back to scene, preserving world transforms
        for (const obj of (jointObjectMap.get(selectedJointIndex) ?? []))
          scene.attach(obj);
        for (const m of (jointMeshMap.get(selectedJointIndex) ?? []))
          m.material.emissive.copy(NO_EMISSIVE);
      }

      selectedJointIndex = idx;

      // Sync dropdown
      const jSel = document.getElementById('joint-select');
      if (jSel) jSel.value = idx >= 0 ? String(idx) : '';

      if (idx >= 0) {
        // ── Select new ────────────────────────────────────────────────────────
        // Position gizmo pivot at joint's pose center
        positionGizmo(idx);

        // Reparent all joint objects to pivot — they move with the gizmo for free
        for (const obj of (jointObjectMap.get(idx) ?? []))
          gizmoPivot.attach(obj);   // preserves world position, changes parent

        // Highlight visible meshes
        for (const m of (jointMeshMap.get(idx) ?? []))
          m.material.emissive.copy(HIGHLIGHT);
      } else {
        gizmo.detach();
      }
      updateStatus();
    }

    // ── Build / rebuild scene from geometry JSON ──────────────────────────────
    function buildScene(geo) {
      // 0. Tear down any live preview tubes from the previous drag
      _removeLiveTubes();

      // 1. Return any joint objects currently parented to the pivot back to scene
      //    (scene.attach preserves world transform)
      for (const child of [...gizmoPivot.children])
        scene.attach(child);

      // 2. Remove all tree objects from the scene
      for (const obj of treeObjects)
        if (obj.parent) obj.parent.remove(obj);
      treeObjects.length = 0;

      // 3. Clear per-joint maps
      jointMeshMap.clear();
      jointObjectMap.clear();
      linkObjectMap.clear();
      allJointMeshes.length = 0;

      // 4. Update joint metadata
      jointInfo    = {};
      parentsArray = geo.parents ?? [];
      if (geo.maxAnglePerElbow !== undefined) maxAnglePerElbow = geo.maxAnglePerElbow;
      for (const j of (geo.joints ?? [])) jointInfo[j.index] = j;

      // 5. Build meshes
      for (const m of geo.meshes) {
        const positions = new Float32Array(m.vertices.flat());
        const indices   = new Uint32Array(m.faces.flat());

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geom.setIndex(new THREE.BufferAttribute(indices, 1));
        geom.computeVertexNormals();

        const [r, g, b, a] = m.color;
        const mat = new THREE.MeshPhongMaterial({
          color:       new THREE.Color(r, g, b),
          emissive:    NO_EMISSIVE.clone(),
          opacity:     m.pick_only ? 0 : a,
          transparent: m.pick_only || a < 0.99,
          depthWrite:  !m.pick_only,
          side:        THREE.DoubleSide,
          shininess:   60,
        });

        const mesh = new THREE.Mesh(geom, mat);
        mesh.userData.pickOnly = !!m.pick_only;

        const ji = m.joint_index;
        if (ji !== undefined && ji >= 0) {
          mesh.userData.jointIndex = ji;
          if (!jointMeshMap.has(ji))   jointMeshMap.set(ji, []);
          if (!jointObjectMap.has(ji)) jointObjectMap.set(ji, []);
          if (!m.pick_only) jointMeshMap.get(ji).push(mesh);
          jointObjectMap.get(ji).push(mesh);
          allJointMeshes.push(mesh);
        }
        const li = m.link_index;
        if (li !== undefined && li >= 0) {
          if (!linkObjectMap.has(li)) linkObjectMap.set(li, []);
          linkObjectMap.get(li).push(mesh);
        }

        scene.add(mesh);
        treeObjects.push(mesh);
      }

      // 6. Build lines
      for (const ln of geo.lines) {
        const positions = new Float32Array(ln.points.flat());
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const [r, g, b, a] = ln.color;
        const mat = new THREE.LineBasicMaterial({
          color: new THREE.Color(r, g, b), opacity: a, transparent: a < 0.99,
        });
        const line = new THREE.Line(geom, mat);

        const ji = ln.joint_index;
        if (ji !== undefined && ji >= 0) {
          if (!jointObjectMap.has(ji)) jointObjectMap.set(ji, []);
          jointObjectMap.get(ji).push(line);
        }
        const li = ln.link_index;
        if (li !== undefined && li >= 0) {
          if (!linkObjectMap.has(li)) linkObjectMap.set(li, []);
          linkObjectMap.get(li).push(line);
        }

        scene.add(line);
        treeObjects.push(line);
      }

      // 7. Restore selection: highlight + reparent + reposition gizmo
      if (selectedJointIndex >= 0 && jointInfo[selectedJointIndex]) {
        for (const m of (jointMeshMap.get(selectedJointIndex) ?? []))
          m.material.emissive.copy(HIGHLIGHT);
        positionGizmo(selectedJointIndex);
        for (const obj of (jointObjectMap.get(selectedJointIndex) ?? []))
          gizmoPivot.attach(obj);
      } else {
        gizmo.detach();
      }

      populateJointSelectors();
      updateStatus();
    }

    // ── Initial geometry load ─────────────────────────────────────────────────
    async function loadInitialGeometry() {
      status.textContent = 'Loading geometry...';
      try {
        const res = await fetch('/geometry');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        buildScene(await res.json());

        fitCamera();
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
        console.error(err);
      }
    }

    // ── Send gizmo result to server, rebuild links ────────────────────────────
    async function sendMoveJoint() {
      if (selectedJointIndex < 0) return;

      gizmoPivot.updateMatrixWorld(true);
      const pos  = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scl  = new THREE.Vector3();
      gizmoPivot.matrixWorld.decompose(pos, quat, scl);

      updateStatus('updating…');
      try {
        const res = await fetch('/move_joint', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            joint_index: selectedJointIndex,
            position:    [pos.x,  pos.y,  pos.z],
            quaternion:  [quat.x, quat.y, quat.z, quat.w],
          }),
        });

        if (res.status === 422) {
          // Server rejected the move (link reconstruction failed) —
          // revert gizmo and display to the pre-drag state.
          gizmoPivot.position.copy(_dragStartPos);
          gizmoPivot.quaternion.copy(_dragStartQuat);
          gizmoPivot.updateMatrixWorld(true);
          _removeLiveTubes();
          _setServerLinksVisible(selectedJointIndex, true);
          updateStatus('move rejected — no valid path');
          return;
        }

        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        buildScene(await res.json());
      } catch (err) {
        updateStatus(`server error: ${err.message}`);
        console.error(err);
      }
    }

    // ── Click → raycast select ────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const ndcMouse  = new THREE.Vector2();
    let mouseDownX = 0, mouseDownY = 0;

    renderer.domElement.addEventListener('mousedown', e => {
      mouseDownX = e.clientX; mouseDownY = e.clientY;
    });

    renderer.domElement.addEventListener('click', e => {
      const dx = e.clientX - mouseDownX, dy = e.clientY - mouseDownY;
      if (Math.sqrt(dx*dx + dy*dy) > 5) return;

      const rect = renderer.domElement.getBoundingClientRect();
      ndcMouse.set(
        ((e.clientX - rect.left) / rect.width)  *  2 - 1,
        ((e.clientY - rect.top)  / rect.height) * -2 + 1
      );
      raycaster.setFromCamera(ndcMouse, camera);
      const hits = raycaster.intersectObjects(allJointMeshes, false);
      selectJoint(hits.length > 0 ? hits[0].object.userData.jointIndex : -1);
    });

    // ── Keyboard shortcuts ────────────────────────────────────────────────────
    window.addEventListener('keydown', e => {
      const tag = e.target.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'z') { e.preventDefault(); undo(); return; }
        if (e.key === 'y') { e.preventDefault(); redo(); return; }
        return;
      }
      switch (e.key.toLowerCase()) {
        case 't':
          gizmoMode = 'translate'; gizmo.setMode('translate');
          document.querySelector('input[name="gmode"][value="translate"]').checked = true;
          break;
        case 'r':
          gizmoMode = 'rotate'; gizmo.setMode('rotate');
          document.querySelector('input[name="gmode"][value="rotate"]').checked = true;
          break;
        case ' ':
          e.preventDefault();
          gizmoSpace = gizmoSpace === 'world' ? 'local' : 'world';
          gizmo.setSpace(gizmoSpace);
          document.getElementById('gizmo-local').checked = (gizmoSpace === 'local');
          break;
        case 'delete':
          if (selectedJointIndex >= 0) document.getElementById('btn-delete').click();
          return;
        case 'escape': selectJoint(-1); return;
      }
      updateStatus();
    });

    // ── Camera fit ────────────────────────────────────────────────────────────
    function fitCamera() {
      if (treeObjects.length === 0) return;  // nothing to fit
      const box = new THREE.Box3();
      for (const obj of treeObjects) box.expandByObject(obj);
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3()).length();
      orbit.target.copy(center);
      camera.position.copy(center).addScaledVector(
        new THREE.Vector3(1, 0.7, 1).normalize(), size * 1.8);
      camera.near = size * 0.001;
      camera.far  = size * 20;
      camera.updateProjectionMatrix();
      orbit.update();
    }

    // ── Panel helpers ─────────────────────────────────────────────────────────

    async function apiPost(url, data) {
      const res = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error ?? `HTTP ${res.status}`);
      return json;
    }

    function populateJointSelectors() {
      const jSel = document.getElementById('joint-select');
      jSel.innerHTML = '';
      const idxs = Object.keys(jointInfo).map(Number).sort((a,b) => a-b);
      for (const i of idxs) {
        jSel.add(new Option(`${i}: ${jointInfo[i].type}`, i));
      }
      jSel.value = selectedJointIndex >= 0 ? String(selectedJointIndex) : '';
    }

    // Keep joint-select in sync when a joint is clicked in viewport
    const _origSelectJoint = selectJoint;

    // ── Add Joints panel ──────────────────────────────────────────────────────
    async function addJoint(type) {
      // If tree is non-empty, a joint must be selected to act as parent
      const treeHasJoints = Object.keys(jointInfo).length > 0;
      if (treeHasJoints && selectedJointIndex < 0) {
        updateStatus('Select a parent joint first (click one or use the dropdown)');
        return;
      }
      const parentIdx = treeHasJoints ? selectedJointIndex : 0;
      try {
        updateStatus(`Adding ${type}…`);
        const geo = await apiPost('/add_joint', { joint_type: type, parent_index: parentIdx });
        buildScene(geo);
        fitCamera();
        // auto-select the new joint (last index)
        const newIdx = Math.max(...Object.keys(jointInfo).map(Number));
        selectJoint(newIdx);
      } catch (err) { updateStatus(`Add failed: ${err.message}`); }
    }

    document.getElementById('btn-add-transverse').addEventListener('click', () => addJoint('TransverseRevolute'));
    document.getElementById('btn-add-coaxial').addEventListener('click',    () => addJoint('CoaxialRevolute'));
    document.getElementById('btn-add-tip').addEventListener('click',        () => addJoint('Tip'));

    document.getElementById('btn-clear-tree').addEventListener('click', async () => {
      if (!confirm('Clear the tree and start fresh?')) return;
      try {
        const geo = await apiPost('/clear_tree', {});
        selectedJointIndex = -1;
        buildScene(geo);
      } catch (err) { updateStatus(`Clear failed: ${err.message}`); }
    });

    // ── Edit Joints panel ─────────────────────────────────────────────────────
    document.getElementById('joint-select').addEventListener('change', e => {
      selectJoint(parseInt(e.target.value));
    });

    document.getElementById('btn-delete').addEventListener('click', async () => {
      if (selectedJointIndex < 0) return;
      try {
        updateStatus('Deleting…');
        const geo = await apiPost('/delete_joint', { joint_index: selectedJointIndex });
        selectedJointIndex = -1;
        buildScene(geo);
      } catch (err) { updateStatus(`Delete failed: ${err.message}`); }
    });

    document.querySelectorAll('input[name="gmode"]').forEach(r => {
      r.addEventListener('change', () => {
        gizmoMode = r.value; gizmo.setMode(gizmoMode); updateStatus();
      });
    });

    document.getElementById('gizmo-local').addEventListener('change', e => {
      gizmoSpace = e.target.checked ? 'local' : 'world';
      gizmo.setSpace(gizmoSpace); updateStatus();
    });

    // ── File panel ────────────────────────────────────────────────────────────
    async function undo() {
      try { buildScene(await apiPost('/undo', {})); } catch { updateStatus('Nothing to undo'); }
    }
    async function redo() {
      try { buildScene(await apiPost('/redo', {})); } catch { updateStatus('Nothing to redo'); }
    }
    document.getElementById('btn-undo').addEventListener('click', undo);
    document.getElementById('btn-redo').addEventListener('click', redo);
    document.getElementById('btn-save').addEventListener('click', () => { window.location.href = '/save_tree'; });
    document.getElementById('btn-export').addEventListener('click', () => { window.location.href = '/export_link_modules'; });
    document.getElementById('btn-load').addEventListener('click', () => document.getElementById('load-file-input').click());
    document.getElementById('load-file-input').addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      try {
        updateStatus('Loading…');
        const res = await fetch('/load_tree', { method: 'POST', body: fd });
        const geo = await res.json();
        if (!res.ok) throw new Error(geo.error);
        selectedJointIndex = -1; buildScene(geo);
      } catch (err) { updateStatus(`Load failed: ${err.message}`); }
    });

    // ── Render loop ───────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      orbit.update();
      renderer.render(scene, camera);
    }

    loadInitialGeometry();
    animate();
  </script>
</body>
</html>
