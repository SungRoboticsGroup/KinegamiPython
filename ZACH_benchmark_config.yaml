tests:
  - name: "small_sparse"
    seed: 42
    num_links: 5
    point_density: 5.0

scaling_tests:
  density_scaling:
    num_links: 5
    seed: 789
    densities: [1.0, 5.0]
  
  link_scaling:
    point_density: 5.0
    seed: 789
    num_links_list: [5, 10]
    num_links_list: [5, 10, 20, 50, 100, 200, 500]

link_generation:
  radius_range: [0.5, 2.0]
  max_angle_per_elbow: 1.5708  # pi/2
  position_range: [-50.0, 50.0]
  epsilon: 0.01
  distance_rtol: 1e-4
  distance_atol: 1e-6
  allow_point_mismatch: true

timeouts:
  serial_method_timeout: 3  # seconds (5 minutes)

collision_analysis:
  intersection_threshold_multiplier: 1.0  # multiply by r to get collision threshold
  report_statistics: false
